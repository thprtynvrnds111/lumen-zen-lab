    <!-- ATC beacon — server-side count of buy-CTA clicks, for the pixel loss-rate
         measurement. Registered in <head> on the capture phase with plain DOM, so
         it sees clicks that happen before React hydrates or fbevents.js loads —
         exactly the clicks the pixel's image beacon loses. POSTs own-origin with
         fetch keepalive (survives page unload by spec, unlike an image beacon).
         Sink: /api/atc-beacon → engine box. Guarded by src/test/atcBeacon.test.ts. -->
    <script>
      (function () {
        document.addEventListener('click', function (ev) {
          try {
            var t = ev.target;
            var el = t && t.closest ? t.closest('[data-atc-beacon]') : null;
            if (!el) return;
            var eid = 'atc-' + (window.crypto && crypto.randomUUID
              ? crypto.randomUUID()
              : Date.now() + '-' + Math.random().toString(36).slice(2));
            // Future server-side AddToCart mirror reuses this as the fbq eventID.
            window.__zpAtcEventId = eid;
            fetch('/api/atc-beacon', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              keepalive: true,
              body: JSON.stringify({
                event_id: eid,
                slug: el.getAttribute('data-beacon-slug') || '',
                placement: el.getAttribute('data-beacon-placement') || ''
              })
            }).catch(function () {});
          } catch (e) { /* tracking never breaks the page */ }
        }, true);
      })();
    </script>

    <!-- Deferred analytics: GA4 + Clarity after load, Meta Pixel script loaded on DOMContentLoaded -->
    <script>
      // Load Meta Pixel fbevents.js on DOMContentLoaded (stub already defined in <head>)
      // DOMContentLoaded fires ~2-4s earlier than window.load on mobile → fixes LPV gap
      (function() {
        function loadFbEvents() {
          var t = document.createElement('script');
          t.async = true;
          t.src = 'https://connect.facebook.net/en_US/fbevents.js';
          document.head.appendChild(t);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadFbEvents);
        } else {
          loadFbEvents();
        }
      })();

      // GA4 + Clarity after full page load (non-critical)
      window.addEventListener('load', function() {
        setTimeout(function() {

            function gtag(){window.dataLayer.push(arguments);}
